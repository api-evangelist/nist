principles:
  - name: Visibility
    description: Track per-key request counts client-side; NIST does not expose a usage dashboard. Log
      response codes (200/403) and align to the 30-second rolling window.
  - name: Allocation
    description: Issue separate API keys per consuming application or environment so quota usage can
      be attributed and one team's bug does not starve another.
  - name: Optimization
    description: Cache NVD CVE data locally and use lastModStartDate windowed sync; avoid re-fetching
      static records. Honor the 6-second inter-request sleep to avoid 403s and unnecessary retries.
  - name: Accountability
    description: Designate a public-data steward per consuming team responsible for honoring the NIST
      Terms of Use, key rotation, and uptime against the public quota.
